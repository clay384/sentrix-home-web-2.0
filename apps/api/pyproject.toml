[project]
name = "sentrix"
version = "0.1.0"
description = "Sentrix Home 2.0 product API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12,<1",
    "pillow>=11,<12",
    "pillow-heif>=0.18,<1",
    "numpy>=1.26,<3",
    # 视觉记忆是**进程内**推理（设计 §2.2：模型适配属于 apps/api，进程生命周期
    # 不归 2.0 管的是 8100/8101 那些服务）。chinese-clip 的权重是
    # ~/.cache/clip/clip_cn_vit-l-14.pt，约 1.6GB，随 cn-clip 之外单独下载。
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "cn-clip>=1.6,<2",
    # 本地 Mac legacy 部署的 BGE-M3 sidecar 使用 transformers 加载 CPU 权重；API
    # 进程本身仍只通过 HTTP 访问它，不会因此在启动时载入文本模型。
    "transformers>=4.48,<5",
    # 嵌入式 Qdrant 做派生索引；权威始终是 SQLite 的 memory_vectors。
    "qdrant-client>=1.12,<2",
    # 地点解析（设计 §3.3）：PyGeoCN 提供国内省/市/区县的**面**（内置 16MB 天地图边界
    # GeoJSON，随包发布），geopandas 是它的运行时依赖。1.0 用的就是这个包与这个版本。
    "pygeo_cn>=0.1.5,<0.2",
    # 乡镇/村庄的最近邻索引（NEW-2.0）：GeoNames 中国区约 96 万条点，cKDTree 建在
    # 三维单位向量上。1.0 没有这一层；scipy 也不是 1.0 的依赖之外的额外负担——
    # 1.0 venv 里本来就有 scipy 1.15.3（reverse_geocoder 用它）。
    "scipy>=1.15,<2",
    # 人脸链路（S5b）。三个包在 153 上是**试装验证过的**（见 s5-deviations 第 55/56/111 条）：
    # onnxruntime-gpu 的 CUDA EP 只有先预载 cu13 运行库才起得来，否则**静默退化成 CPU**；
    # insightface 依赖未加约束的 ``onnxruntime``（CPU 版），两个发行包共用同一个
    # ``onnxruntime`` 命名空间，所以两个都钉在**同一个版本**、且 GPU 那个最后装
    # （install 顺序写在 docs/runbooks 里，不是靠 pip 自己决定）。
    #
    # **这条约束现在有运行时的一半。** 上面那个命名空间把戏已经咬过三次（第 111 条那次是
    # 真实仓库的 venv 被覆盖成 CPU 版，``make ci`` 21 分钟 → 55 分钟而外表是「卡住」），所以
    # `onnx_runtime.require_requested_providers` 会在每个 session 建完时读
    # ``get_providers()``：**请求了 CUDA 而实际只有 CPU 就直接抛错拒启**，报错里给出的修复
    # 命令钉的正是下面这个版本号——两处必须一起改，改一处另一处就成了谎话。
    # 纯 CPU 部署是合法形态，但要**显式**声明：``FACE_PROVIDERS=CPUExecutionProvider``
    # （``RETINAFACE_PROVIDERS`` 同）。
    #
    # 跨平台安装（2026-10-21）：``onnxruntime-gpu`` 在 macOS 没有 wheel，Jetson 的
    # aarch64 GPU 包也不在 PyPI；把它们写死在 base 里会让 Mac/118 的 ``make install``
    # 直接失败。按平台分流：
    #   · Linux x86_64（153）→ GPU 包，保留 CUDA 人脸；
    #   · macOS / Linux aarch64（158/46/118）→ CPU 包，显式声明 CPU provider 即可。
    "onnxruntime-gpu==1.30.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime==1.30.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "insightface==1.0.1",
    # headless：服务端不装 GUI 那份，1.0 两份都装了是因为它还要在开发机上跑预览。
    "opencv-python-headless>=4.10,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "pre-commit>=4,<5",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 迁移脚本不是 .py，不加这条不会进 wheel。editable 安装读源码树看不出来，
# 部署装 wheel 时 MIGRATIONS_DIR 会变成空目录——那正是 migrate() 过去静默 no-op 的分支。
[tool.setuptools.package-data]
sentrix = [
    "infrastructure/persistence/migrations/*.sql",
    # 地名别名表随包发布。放在包内而不是仓库根的 data/ 下：那个目录整条在
    # .gitignore 里（`/data/` 是运行期数据目录），放进去就不受版本控制，
    # 「可审查、可替换、可测试」三条一条都做不到。见 s4-deviations.md §2 第 5 项。
    "infrastructure/places/data/*.json",
]
