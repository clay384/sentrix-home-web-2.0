      summary: Start Family Graph Run
      description: '手工跑一趟家庭图谱推断。1.0 ``app.py:1711-1723``。


        **1.0 的前端从不调它**（``api.js:110`` 全仓只有定义），所以这是运维与调试入口——

        自动那条走批末触发（T314）。**照搬它，不为它编造消费场景。**'
      operationId: start_family_graph_run_api_v1_family_graph_runs_post
      requestBody:
        content:
