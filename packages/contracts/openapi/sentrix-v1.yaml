      summary: Update Family Relationship
      description: '建一对亲属边。1.0 ``app.py:1676-1693``。


        这里**不判两个实体 id 是否给全**——1.0 只判 ``scope_id``，其余四个原样交给仓储，

        由它抛 ``family relationship requires both predicates`` 之类。少判一步的结果是

        错误消息不同，多判一步会挡掉仓储自己那几句话术。'
      operationId: update_family_relationship_api_v1_family_graph_relationships_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyRelationshipRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyRelationshipResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - family
      summary: Retract Family Relationship
      description: 撤回一对亲属边，**同时落一行 block 挡住模型恢复**。1.0 ``app.py:1696-1708``。
      operationId: retract_family_relationship_api_v1_family_graph_relationships_delete
      requestBody:
        content:
