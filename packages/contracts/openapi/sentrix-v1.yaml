          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/relationships/{relationship_id}/confirm:
    post:
      tags:
      - relationships
      summary: Confirm Relationship
      description: '确认。仓储会把同三元组的**其它 active 关系转 superseded**。


        **这里不写 semantic claim**——1.0 的 ``confirm_relationship`` 也不写，只有

        ``create_relationship(status=''active'')`` 写。那是一条反直觉但真实的行为，

        写在仓储的 docstring 里。'
      operationId: confirm_relationship_api_v1_relationships__relationship_id__confirm_post
