            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/relationships:
    get:
      tags:
      - relationships
      summary: List Relationships
      description: '关系图。``kind == "person"`` 时**两端都必须是人物**，且排掉 ``retracted``。


        两条分支的过滤位置不同，都是 1.0 的：``person`` 那支在 SQL 里

        （``list_person_relationships``），另一支在 Python 里——``list_entities`` 不带类型

        参数（``app.py:2100`` 的列表推导）。两边的**状态口径也相反**：``person`` 排

        ``retracted``，另一支连 ``retracted`` 都给。'
      operationId: list_relationships_api_v1_relationships_get
      parameters:
      - name: scope_id
        in: query
