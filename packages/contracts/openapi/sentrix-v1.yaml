  /api/v1/family-graph/people/{person_id}/membership:
    patch:
      tags:
      - family
      summary: Update Family Membership
      description: '改一个人的家庭归属。1.0 ``app.py:1660-1673``。


        ``source="user_override"`` 与 ``confidence=1.0`` 都是**写死的**：这是用户按下的动作，

        落库行 ``locked = 1``，此后模型的推断不许覆盖它。'
      operationId: update_family_membership_api_v1_family_graph_people__person_id__membership_patch
      parameters:
      - name: person_id
