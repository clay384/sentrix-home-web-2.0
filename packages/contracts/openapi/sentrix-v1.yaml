                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/family-graph/scopes/merge:
    post:
      tags:
      - family
      summary: Merge Family Graph Scopes
      description: '把若干 scope 并成一张图。1.0 ``app.py:1725-1730``。


        **响应没有 ``ok`` 键**：1.0 直接 ``return store.merge_family_scopes(...)``，

        而那个函数返回 ``{"graph_id", "scope_ids"}``。与另外四个写路由不一致，照搬。'
      operationId: merge_family_graph_scopes_api_v1_family_graph_scopes_merge_post
