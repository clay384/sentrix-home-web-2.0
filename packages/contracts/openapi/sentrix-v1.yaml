        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipGraphResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - relationships
      summary: Create Relationship
      description: '建一条关系，或把已有的那条并掉（同三元组去重在仓储里）。


        **三个必填项是路由判的**，不是 pydantic——1.0 给的是 400 加一句具体的话，

        缺字段走 pydantic 会变成 422，那是同一个产品行为的另一个码。'
      operationId: create_relationship_api_v1_relationships_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipPayload'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/relationships/batch:
    post:
      tags:
      - relationships
      summary: Import Relationships
      description: '批量导入。**逐条失败不让整批失败**——1.0 的 ``except Exception`` 就在循环里。


        调用方是 PhotoBench 的 identity_seed 阶段，详见用例的模块 docstring。'
