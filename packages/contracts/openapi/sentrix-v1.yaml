  /api/v1/imports:
    post:
      tags:
      - timeline
      summary: Import Album
      description: '整册导入 + **批末自动跑一趟人物画像**（裁决④）。**同步执行**：2.0 没有任务队列，

        装作异步只会把「跑到哪了」藏起来。


        整册导入要串行走模型调用，本切片又在这个请求的末尾加了一整趟画像流水线（每个核心

        人物至少一次模型调用，加上 moments 阶段每人每资产一次），所以这个请求会跑很久——

        客户端的超时必须自己调大，这一点写在 ``docs/runbooks/geonames-data.md`` 的相邻章节

        （导入一节）。**这是裁决④ 明确接受的代价**，记账在

        ``docs/refactor/2026-09-24-s5c-implementation-plan.md`` 第 0 节。


        **画像那一趟抛出来会让整个请求 500，而照片其实已经入库了。** 不吞是有意的：吞掉

        之后「画像从来没生成过」会变成一个没人看得见的状态，而重跑一次导入的代价由去重

        兜住（``deduplicated`` 那一列）。判据与 ``RunInsights`` 自己的 docstring 一致。'
      operationId: import_album_api_v1_imports_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBatchRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/imports/{operation_id}/progress:
    get:
      tags:
      - timeline
      summary: Get Import Progress
      operationId: get_import_progress_api_v1_imports__operation_id__progress_get
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          title: Operation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportProgressResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/videos/{asset_id}:
    get:
      tags:
      - videos
      summary: Get Video
      operationId: get_video_api_v1_videos__asset_id__get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      responses:
        '200':
          description: Successful Response
