          - type: 'null'
          title: Family Role
      type: object
      title: BatchConfirmItem
    BatchConfirmOutcome:
      properties:
        person_id:
          type: string
          title: Person Id
        entity_id:
          type: string
          title: Entity Id
        name:
          type: string
          title: Name
        family_role:
          anyOf:
