openapi: 3.1.0
info:
  title: Sentrix Home API
  version: 0.1.0
paths:
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Health Live
      description: 轻量存活探针：不访问任何依赖，也不进线程池。
      operationId: health_live_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Live Api V1 Health Live Get
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health
      description: '进程与它依赖的**当前**可用性。


        **为什么嵌入器要进来。** 2026-10-10 那轮 PhotoBench 评测里，WeMM 嵌入侧车全程

        不在（354/370 次检索静默降级成 ``backend=none``），而本端点一直回

        ``{"status":"ok"}`` —— 整轮数据作废却没有任何一处报错。数据库好、嵌入器坏，

        不是 ``ok``。


        **为什么是 ``degraded`` 而不是 ``error``。** 嵌入是**可选**依赖：侧车不在时

        检索退回词法/元数据/实体三路，进程照常服务。两档分开才能让「还能用但少了东西」

        与「用不了」在监控上可区分；把两者压成一个失败码，运维就没法只对后者告警。


        探测走 ``EmbeddingHealthProbe``，它自带 10 秒 TTL（``models/wemm.py``），

        所以这个端点被高频轮询时不会每次都打一次侧车。


        **高频探活请用 ``/health/live``。** 本端点是完整诊断，重负载下不应作为

        看门狗的 1 分钟级探针；保留它是为了不破坏既有消费方。'
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/diagnostics:
    get:
      tags:
      - health
      summary: Diagnostics
      description: 完整诊断：数据库 + 嵌入侧车 + 降级原因。与 ``/health`` 同一份实现。
      operationId: diagnostics_api_v1_diagnostics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsResponse'
  /api/v1/media/import:
    post:
      tags:
      - media
      summary: Import Media
      operationId: import_media_api_v1_media_import_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_media_api_v1_media_import_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets:
    get:
      tags:
      - media
      summary: List Assets
      operationId: list_assets_api_v1_assets_get
      parameters:
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Scope Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets/{asset_id}:
    get:
      tags:
      - media
      summary: Get Asset
      operationId: get_asset_api_v1_assets__asset_id__get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets/{asset_id}/file:
    get:
      tags:
      - media
      summary: Get Asset File
      description: '``?original=1`` 拿原片；不传时**视频**给浏览器预览件（1.0 ``app.py:2448-2478``）。


        音频与图片这条路上 ``original`` 是空操作：音频本来就只有原片可交

        （``deliver_media`` 对音频恒回落原文件），图片的 ``/file`` 一直是原文件

        （契约测试钉着「交出去的字节与传上来的一模一样」），预览在 ``/preview``。

        不为了对称去改图片——改了会让 HEIC 从「原图直出」变成「转码件直出」，那是另一个决定。'
      operationId: get_asset_file_api_v1_assets__asset_id__file_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: original
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Original
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assets/{asset_id}/preview:
    get:
      tags:
      - media
      summary: Get Asset Preview
      operationId: get_asset_preview_api_v1_assets__asset_id__preview_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/search:
    get:
      tags:
      - search
      summary: Search Assets
      operationId: search_assets_api_v1_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          description: 内容词，例如 桥 / 海边 / 红色
          title: Q
        description: 内容词，例如 桥 / 海边 / 红色
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Scope Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: time_range
        in: query
        required: false
        schema:
          type: string
          maxLength: 60
          description: 时间条件，例如 2023年10月 / 2025年-2026年
          default: ''
          title: Time Range
        description: 时间条件，例如 2023年10月 / 2025年-2026年
      - name: person
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 人物条件，可重复：scope 内已确认人物的本名
          default: []
          title: Person
        description: 人物条件，可重复：scope 内已确认人物的本名
      - name: place
        in: query
        required: false
        schema:
          type: string
          maxLength: 60
          description: 地点条件，服务端按解析出的行政区/地名匹配
          default: ''
          title: Place
        description: 地点条件，服务端按解析出的行政区/地名匹配
      - name: media_type
        in: query
        required: false
        schema:
          type: string
          maxLength: 20
          description: 媒体类型：image / video / audio / text
          default: ''
          title: Media Type
        description: 媒体类型：image / video / audio / text
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assistant/conversations:
    post:
      tags:
      - assistant
      summary: Create Conversation
      operationId: create_conversation_api_v1_assistant_conversations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Successful Response
          content:
