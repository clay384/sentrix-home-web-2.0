  /api/v1/family-graph:
    get:
      tags:
      - family
      summary: Family Graph
      description: '一张家庭图谱。1.0 ``app.py:1648-1656``。


        ``scope_id`` 是**必填**（1.0 的签名里没有默认值），合并过 scope 时它会顺着

        ``family_scope_groups`` 展开成 ``scope_ids``。'
