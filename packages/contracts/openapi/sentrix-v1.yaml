          type: string
          contentMediaType: application/octet-stream
          title: File
        scope_id:
          type: string
          title: Scope Id
          default: home-default
        external_source_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Source Id
        source_timestamp:
