          type: string
          title: Source Location
          default: ''
        source_metadata:
          type: string
          title: Source Metadata
          default: '{}'
      type: object
      required:
      - file
      title: Body_import_media_api_v1_media_import_post
    Body_seed_person_identity_api_v1_people_seed_post:
      properties:
        name:
          type: string
          title: Name
        family_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Family Role
        aliases:
          anyOf:
          - type: string
          - type: 'null'
          title: Aliases
        scope_id:
          type: string
          title: Scope Id
          default: home-default
        face_instance_ids:
          anyOf:
          - type: string
          - type: 'null'
          title: Face Instance Ids
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          default: []
      type: object
      required:
      - name
      title: Body_seed_person_identity_api_v1_people_seed_post
    ChannelTrace:
      properties:
        channel:
          type: string
          title: Channel
        status:
          type: string
          title: Status
        candidate_count:
          type: integer
          title: Candidate Count
        latency_ms:
          type: number
          title: Latency Ms
        backend:
          type: string
          title: Backend
          default: ''
        reason:
          type: string
          title: Reason
          default: ''
      type: object
      required:
      - channel
      - status
      - candidate_count
      - latency_ms
      title: ChannelTrace
      description: '一个召回通道这一次的轨迹。


        **这一块是 S6 的验收条件。** 它要回答的问题只有两个：这一路**跑了没有**、

        以及没跑或降级时**为什么**。没有它，「通道跑了没找到」与「通道根本没跑」

        在响应上完全一样——而 S6 要证明的正是六路（2.0 是五路，``adjacency`` 按裁决不实现）

        真的都在跑。理由与判据写在 ``domain/retrieval/models.py`` 的 ``ChannelTrace`` 上。'
    CompleteEventPayload:
      properties:
        type:
          type: string
          title: Type
          default: complete
        turn_id:
          type: string
          title: Turn Id
        status:
          type: string
          title: Status
        termination_reason:
          type: string
          title: Termination Reason
        answer:
          type: string
          title: Answer
        attachments:
          items:
            $ref: '#/components/schemas/AttachmentSummary'
          type: array
          title: Attachments
        requirements:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Requirements
        retrieved_candidates:
          items:
            type: string
          type: array
          title: Retrieved Candidates
          default: []
        trace:
          additionalProperties: true
          type: object
          title: Trace
          description: Execution facts. model_calls optionally includes status, attempt,
            duration_ms and tool_argument_parse_facts (json_object_valid per native
            tool envelope); plain-text completion is not a JSON parse attempt.
        error:
          type: string
          title: Error
          default: ''
      type: object
      required:
      - turn_id
      - status
      - termination_reason
      - answer
      - attachments
      - requirements
      title: CompleteEventPayload
      description: '``complete`` 事件的 ``data``。


        与 1.0 的一处刻意差异：**不再把整条 ``public_progress`` 又塞一遍**。1.0 的 ``complete``

        帧把已经逐条发过的进度事件完整重发（``app.py:2989``），是纯粹的带宽浪费。'
    ConfirmClusterRequest:
      properties:
        name:
          type: string
          title: Name
          default: ''
        family_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Family Role
      type: object
      title: ConfirmClusterRequest
    ConfirmClusterResponse:
      properties:
        entity:
          $ref: '#/components/schemas/PersonPayload'
        merged_into:
          anyOf:
          - type: string
          - type: 'null'
          title: Merged Into
      type: object
      required:
      - entity
      - merged_into
      title: ConfirmClusterResponse
      description: '``merged_into`` 非空表示这次确认并进了另一个已存在的人（同名合并）。'
    ConversationDetailResponse:
      properties:
        conversation:
          $ref: '#/components/schemas/ConversationSummary'
