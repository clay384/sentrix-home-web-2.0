  /api/v1/knowledge:
    get:
      tags:
      - knowledge
      summary: Get Knowledge
      description: '语义知识的三块。1.0 ``app.py:1921-1932``。


        **``profiles`` 那一支是 N+1**：不给 ``person_id`` 时对 scope 内每个实体轮流查一次

        （1.0 就是一个生成器加 ``if item`` 过滤）。照搬——它的顺序因此等于实体的

        ``updated_at DESC``。'
