              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/family-graph/people/{person_id}/portrait:
    patch:
      tags:
      - family
      summary: Update Family Portrait
      description: '手写一段家庭画像。1.0 ``app.py:1733-1740``。


        **1.0 这个端点没有 ``try/except``**（另外几个都有）——因为 ``write_family_portrait``

        不抛 ``ValueError``（它连 ``source`` 都不校验）。照搬：这里也不接。'
      operationId: update_family_portrait_api_v1_family_graph_people__person_id__portrait_patch
