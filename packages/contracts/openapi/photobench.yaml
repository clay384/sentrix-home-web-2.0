      tags:
      - model-profiles
      summary: Current Model Get
      description: 1.0 ``:7530``：GET 这一条要明说「请用 POST」，而不是让 405 用 FastAPI 的形状回。
      operationId: current_model_get_api_v1_current_model_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - model-profiles
      summary: Current Model
      description: 1.0 ``:7844``。
      operationId: current_model_api_v1_current_model_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Current Model Api V1 Current Model Post
  /api/v1/test-model:
    post:
      tags:
      - model-profiles
      summary: Test Model
      description: '1.0 ``:7965``：「测试模型端点」按钮。


        2.0 的换模型语义是「重启 2.0」（S9c · 用户裁决③），但那条只影响 run-execution 的

        ``model_deploy`` 与前端交互——**探活本身没有副作用**，所以 2.0 版与 1.0 版逐行

        相同，不往这里加重启语义。'
      operationId: test_model_api_v1_test_model_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Test Model Api V1 Test Model Post
  /api/v1/manifests:
