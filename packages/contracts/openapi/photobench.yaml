      - name: agent_status
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Agent Status
      - name: angle
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Angle
      - name: difficulty
        in: query
        required: false
        schema:
          type: string
          default: ''
