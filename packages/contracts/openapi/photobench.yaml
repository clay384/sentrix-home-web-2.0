  /api/v1/runs/{run_id}/resume:
    post:
      tags:
      - suites
      summary: Resume Run
      description: '``POST /api/runs/{id}/resume``（1.0 ``:7768`` → ``resume_run``
        ``:7488``）。


        202 与 ``POST /runs`` 同：它起后台线程，不是同步完成。


        2026-10-15 之前这条路回 501，理由是「2.0 的 scope 由导入内部 ensure，没有复用

        已存在 scope 这条路（S9b-2 删掉了 ``scope_attach``）」。那条理由随 ``mode=reuse``

        一起消失了——续跑与复用本就是同一件事的两种题目集。'
      operationId: resume_run_api_v1_runs__run_id__resume_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Resume Run Api V1 Runs  Run Id  Resume Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
