      - datasets
      summary: Qa Dataset
      description: 1.0 ``:7695``。``sentrix_url`` 缺省取配置里的——调用方可以指向别的 Sentrix。
      operationId: qa_dataset_api_v1_qa_dataset_get
      parameters:
