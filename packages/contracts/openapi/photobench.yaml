      - datasets
      summary: Get Manifest
      description: '1.0 ``:7689``。1.0 对路径参数做了一次 ``unquote``；FastAPI 自己会解，不再手动解。


        读不到 → 404 ``{"error": "not found"}``（1.0 的文案就是这两个字）。'
