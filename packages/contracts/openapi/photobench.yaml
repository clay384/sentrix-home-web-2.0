      tags:
      - config
      summary: Save Config
      description: '1.0 ``:7822``：落非密钥的连接参数；带 ``judge_api_key`` 时同时写 ``.env.local``。


        成功时的响应体是 1.0 的 ``{"saved": True, "runtime_config": ...}``。'
      operationId: save_config_api_v1_config_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigResponse'
  /api/v1/judge-prompts:
    get:
      tags:
      - config
      summary: List Judge Prompts
      description: 1.0 ``:7719``：三类提示词的默认值、当前自定义值与存储路径。
      operationId: list_judge_prompts_api_v1_judge_prompts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Judge Prompts Api V1 Judge Prompts Get
    post:
      tags:
      - config
      summary: Save Judge Prompt
      description: '1.0 ``:7785``：按 ``kind`` 改一类提示词。


        **这里不接受空串**（1.0 的文案：「empty string to restore default is not allowed

        here」）——恢复默认走 ``DELETE`` 语义上的空值写入，而这条路由是「保存我改的这一版」。'
      operationId: save_judge_prompt_api_v1_judge_prompts_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Save Judge Prompt Api V1 Judge Prompts Post
  /api/v1/judge-prompt:
    post:
      tags:
      - config
      summary: Save Answer Quality Prompt
      description: 1.0 ``:7775``：旧版单提示词入口，只改 ``answer_quality``。
      operationId: save_answer_quality_prompt_api_v1_judge_prompt_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
