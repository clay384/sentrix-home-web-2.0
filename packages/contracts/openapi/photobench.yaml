      tags:
      - runs
      summary: Get Reviews
      description: 1.0 ``:7730``。写侧（``POST``）属 S9b-3。
      operationId: get_reviews_api_v1_runs__run_id__reviews_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Reviews Api V1 Runs  Run Id  Reviews Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/judge-prompt:
